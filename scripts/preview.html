<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family dashboard preview</title>
<style>
  :root { color-scheme: light; font: 15px system-ui, sans-serif; background: #e8e9e7; color: #20231f; }
  body { margin: 32px; }
  main { width: fit-content; max-width: 100%; margin: auto; }
  header { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0 auto 0 0; }
  select { font: inherit; padding: 6px 10px; }
  #status { font-size: 13px; color: #485346; }
  #status[data-error="true"] { color: #a02c1e; }
  .panel { width: 800px; max-width: 100%; aspect-ratio: 5 / 3; background: white; box-shadow: 0 2px 16px #0002; }
  img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  img:not([src]) { visibility: hidden; }
  footer { color: #5c6359; font-size: 13px; margin-top: 16px; }
</style>
<main>
  <header>
    <h1>Family dashboard</h1>
    <label>Layout
      <select id="layout">
        <option value="morning">Morning</option>
        <option value="afternoon">Afternoon</option>
        <option value="test">Hardware test image</option>
      </select>
    </label>
    <span id="status" role="status">Building preview…</span>
  </header>
  <div class="panel"><img id="image" alt="800 by 480 monochrome dashboard preview"></div>
  <footer>800 × 480 pixels · Live local clock · Save source files to update automatically.</footer>
</main>
<script>
  const layout = document.querySelector('#layout');
  const image = document.querySelector('#image');
  const status = document.querySelector('#status');
  let revision = null;
  let displayed = null;

  async function refreshImage() {
    if (!revision) return;
    const selected = layout.value;
    const version = `${selected}:${revision}`;
    if (displayed === version) return;
    const next = new Image();
    next.src = `/${selected}.png?revision=${revision}`;
    await next.decode();
    if (layout.value !== selected) return;
    image.src = next.src;
    displayed = version;
  }

  async function poll() {
    try {
      const response = await fetch('/status', { cache: 'no-store' });
      if (!response.ok) throw new Error('Preview unavailable');
      const state = await response.json();
      revision = state.revision;
      await refreshImage();
      status.textContent = state.error ? 'Build failed — see terminal' : state.building ? 'Building…' : 'Live';
      status.dataset.error = state.error;
    } catch {
      status.textContent = 'Waiting for preview server…';
    } finally {
      setTimeout(poll, 1000);
    }
  }

  layout.addEventListener('change', () => refreshImage().catch(() => {
    status.textContent = 'Waiting for image…';
  }));
  poll();
</script>
</html>
