repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: no-local-username
        name: Check for the local username in file contents
        language: script
        entry: scripts/check-local-username.py
        types: []
        types_or: [file, symlink]
      - id: no-ip-addresses
        name: Reject IPv4 and IPv6 address literals
        language: script
        entry: scripts/check-ip-addresses.py
        types: [text]
      - id: cpp-std-qualification
        name: Check C++ standard-library qualification
        language: script
        entry: scripts/check-cpp-std-qualification.py
        files: '\.(cpp|cppm)$'
