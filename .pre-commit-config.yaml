repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.4
    hooks:
      - id: clang-format
        entry: clang-format
        args: [--style=file, --dry-run, --Werror]
        files: &cpp_files '^(src|tests)/.*\.(cpp|cppm|h|hpp)$'
        types_or: []
        stages: [pre-commit]
      - id: clang-format
        alias: clang-format-fix
        name: Apply clang-format
        entry: clang-format -i
        args: [--style=file]
        files: *cpp_files
        types_or: []
        stages: [manual]
